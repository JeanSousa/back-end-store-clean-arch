services:
  back-end-stores:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: back-end-stores
    depends_on:
      mongo:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - back-end-stores

  mongo-express:
    image: mongo-express:1.0.2-20-alpine3.19
    environment:
      ME_CONFIG_BASICAUTH: "false"
      ME_CONFIG_MONGODB_ADMINUSERNAME: mongousr
      ME_CONFIG_MONGODB_ADMINPASSWORD: mongopwd
      ME_CONFIG_MONGODB_AUTH_DATABASE: admin
      ME_CONFIG_MONGODB_PORT: 27017
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_OPTIONS_EDITORTHEME: dark
    ports:
      - 8082:8081
    depends_on:
      mongo:
        condition: service_healthy
    restart: always
    networks:
      - back-end-stores

  mongo:
    image: mongo:7
    container_name: back-end-stores-mongo
    ports:
      - "27019:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: mongousr
      MONGO_INITDB_ROOT_PASSWORD: mongopwd
      MONGO_INITDB_DATABASE: back-end-stores-db
    healthcheck:
      test: ["CMD", "mongosh", "mongodb://mongousr:mongopwd@localhost:27017/?authSource=admin", "--eval", "db.runCommand('ping').ok"]
      interval: 10s
      timeout: 60s
      retries: 10
    volumes:
      - mongo_vol:/data/db
      - ./scripts/init-mongo.sh:/docker-entrypoint-initdb.d/init-mongo.sh:ro
    restart: unless-stopped
    networks:
      - back-end-stores

volumes:
  mongo_vol:
  redis_vol:

networks:
  back-end-stores:
    name: back-end-stores
    driver: bridge
